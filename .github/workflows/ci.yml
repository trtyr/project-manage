name: CI

# Quality gate for every push to main and every pull request.
# Runs the same canonical commands the project documents in AGENTS.md / the
# justfile: backend clippy + tests (against a migrated Postgres), frontend
# lint + type-check + unit tests + production build.

on:
  push:
    branches: [main]
  pull_request:

# Overrides backend/.cargo/config.toml (`force = false` → shell env wins),
# pointing the compile-time + runtime sqlx checks at the service container.
env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/sec_tracker

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sec_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sec_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Backend toolchain ---
      - name: Install Rust (stable + clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      # The backend uses `sqlx::query!` macros that verify SQL against a LIVE,
      # migrated database at compile time, so the schema must exist before
      # `cargo clippy` / `cargo test`. Migrations use a uniform timestamp naming
      # scheme (`2025071400000N_*`) and are all idempotent (`IF NOT EXISTS`),
      # so plain filename order = sqlx version order = dependency order.
      - name: Apply database migrations
        working-directory: backend
        run: |
          for f in migrations/*.sql; do
            echo "::group::applying $(basename "$f")"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
          done

      - name: Backend — format check (rustfmt)
        working-directory: backend
        run: cargo fmt -- --check

      - name: Backend — clippy (deny warnings)
        working-directory: backend
        run: cargo clippy --all-targets -- -D warnings

      - name: Backend — tests (ts-rs bindings + 10-module CRUD smoke)
        working-directory: backend
        run: cargo test

      # --- Frontend toolchain ---
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Frontend — format check (prettier)
        working-directory: frontend
        run: npm run format:check

      - name: Frontend — lint (oxlint)
        working-directory: frontend
        run: npm run lint

      - name: Frontend — type-check (tsc)
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Frontend — unit tests (vitest)
        working-directory: frontend
        run: npm run test

      - name: Frontend — production build
        working-directory: frontend
        run: npm run build
