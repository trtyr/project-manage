[package]
name = "project-manage-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web framework
axum = { version = "0.8.9", features = ["multipart"] }

# Async runtime
tokio = { version = "1.52.3", features = ["full"] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

# Database (compile-time checked SQL). Wired up in later milestones;
# declared now so future modules don't re-touch Cargo.toml.
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
    "uuid",
    "macros",
    "migrate",
] }

# HTTP middleware
tower = { version = "0.5", features = ["timeout"] }
tower-http = { version = "0.7.0", features = ["cors", "fs", "trace"] }

# Observability
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# HTTP client used by the startup readiness self-check to confirm the
# server actually accepts requests before logging "ready". Defaults are
# disabled to avoid pulling in native-tls; we keep `rustls-tls` so HTTPS
# works if the health target ever moves off localhost. `tokio` is a hard
# dep of reqwest regardless of features, so no runtime feature is needed.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Common value types
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.23.5", features = ["v4", "serde"] }

# Error type ergonomics — derive `Error` for the unified API error mapping.
thiserror = "2.0"

# Load .env files at startup so DATABASE_URL is available to the process.
# Build-time DATABASE_URL (for sqlx::query! macros) is provided by
# `.cargo/config.toml` instead, which Cargo picks up automatically.
dotenvy = "0.15"

# Authentication: argon2id password hashing (RustCrypto stable line) and
# cookie-backed sessions as tower middleware with the official Postgres
# store. Pairing (verified 2026-08-27): tower-sessions 0.14 / core 0.14 /
# sqlx-store 0.15 (first store release using core 0.14).
# NOTE: sqlx-store forces sqlx's `time` feature on, which flips every
# TIMESTAMPTZ/DATE macro inference to time-crate types. Workaround (user-
# approved 2026-08-27): every macro query annotates temporal columns with
# `AS "col: chrono::DateTime<chrono::Utc>"` / `AS "col: chrono::NaiveDate"`.
argon2 = "0.5.3"
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.15", features = ["postgres"] }

# Bind-side conversion helpers (db/helpers.rs) for macro queries. With
# sqlx's `time` feature force-enabled (via sqlx-store above), temporal
# *bind parameters* in `query!`/`query_as!` macros expect time-crate
# types; our models stay chrono. This direct dep does NOT change macro
# inference (that's sqlx's own `time` feature, not this crate).
time = "0.3"

# Generate TypeScript types from Rust structs at test time.
# `chrono-impl`/`uuid-impl` features pull in the chrono/uuid crates and
# provide the `TS` impls that map `DateTime<Utc>` and `Uuid` to `string`.
# `no-serde-warnings` keeps `#[derive(ts_rs::TS)]` quiet on DTOs that
# only derive `Deserialize` (no `Serialize`).
ts-rs = { version = "10", features = ["chrono-impl", "uuid-impl", "no-serde-warnings"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
# smoke tests need the cookie jar (session auth round-trips); the main
# dependency disables default features, so pull reqwest with cookies here.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
