[package]
name = "project-manage-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web framework
axum = { version = "0.8.9", features = ["multipart"] }

# Async runtime
tokio = { version = "1.52.3", features = ["full"] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

# Database (compile-time checked SQL). Wired up in later milestones;
# declared now so future modules don't re-touch Cargo.toml.
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
    "uuid",
    "macros",
    "migrate",
] }

# HTTP middleware
tower = { version = "0.5", features = ["timeout"] }
tower-http = { version = "0.7.0", features = ["cors", "fs", "trace"] }

# Observability
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# HTTP client used by the startup readiness self-check to confirm the
# server actually accepts requests before logging "ready". Defaults are
# disabled to avoid pulling in native-tls; we keep `rustls-tls` so HTTPS
# works if the health target ever moves off localhost. `tokio` is a hard
# dep of reqwest regardless of features, so no runtime feature is needed.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Common value types
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.23.5", features = ["v4", "serde"] }

# Error type ergonomics — derive `Error` for the unified API error mapping.
thiserror = "2.0"

# Load .env files at startup so DATABASE_URL is available to the process.
# Build-time DATABASE_URL (for sqlx::query! macros) is provided by
# `.cargo/config.toml` instead, which Cargo picks up automatically.
dotenvy = "0.15"

# Generate TypeScript types from Rust structs at test time. The
# `chrono-impl`/`uuid-impl` features pull in the chrono/uuid crates and
# provide the `TS` impls that map `DateTime<Utc>` and `Uuid` to `string`.
# `no-serde-warnings` keeps `#[derive(ts_rs::TS)]` quiet on DTOs that
# only derive `Deserialize` (no `Serialize`).
ts-rs = { version = "10", features = ["chrono-impl", "uuid-impl", "no-serde-warnings"] }